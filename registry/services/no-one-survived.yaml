schema: 1
id: no-one-survived
name: No One Survived
description: No One Survived zombie survival dedicated server (Windows build), installed through SteamCMD.
homepage: https://store.steampowered.com/app/1963370/No_One_Survived/
version: "1"
platforms: [windows]

install:
  steamcmd:
    app_id: 2329680

settings:
  - key: server_name
    prompt: Server name (up to 32 characters)
    type: string
    default: Anyserve NOS
  - key: save_name
    prompt: Save name
    type: string
    default: MySave
  - key: max_players
    prompt: Maximum players
    type: int
    default: 50
    min: 1
    max: 100
  - key: zombies
    prompt: Number of zombies
    type: int
    default: 50
    min: 25
    max: 100
  - key: region
    prompt: Region
    type: choice
    default: All
    choices:
      - { value: All, label: All }
      - { value: NA, label: North America }
      - { value: SA, label: South America }
      - { value: EU, label: Europe }
      - { value: AS, label: Asia }
      - { value: AF, label: Africa }
      - { value: OC, label: Oceania }
  - key: password
    prompt: Server password (empty for none)
    type: string
    secret: true
    optional: true
  - key: admin_password
    prompt: Admin password (leave empty to generate one)
    type: string
    secret: true
    generate: true

ports:
  - name: game
    port: 7777
    protocol: udp
    public: true
    description: Players connect here.
  - name: query
    port: 27015
    protocol: udp
    public: true
    description: Steam server browser.

files:
  - path: WRSH/Saved/Config/WindowsServer/Engine.ini
    format: ini
    set:
      URL.Port: "{{.Ports.game}}"
      OnlineSubsystemSteam.GameServerQueryPort: "{{.Ports.query}}"
      OnlineSubsystemSteam.bUseSteamNetworking: "False"
  - path: WRSH/Saved/Config/WindowsServer/Game.ini
    format: ini
    set:
      ServerSetting.ServerName: "{{.Settings.server_name}}"
      ServerSetting.SaveName: "{{.Settings.save_name}}"
      ServerSetting.MaxPlayers: "{{.Settings.max_players}}"
      ServerSetting.NumOfZombieSpawn: "{{.Settings.zombies}}"
      ServerSetting.Region: "{{.Settings.region}}"
      ServerSetting.NeedPassword: "{{if .Settings.password}}True{{else}}False{{end}}"
      ServerSetting.Password: "{{.Settings.password}}"
      ServerSetting.AdminPassword: "{{.Settings.admin_password}}"

run:
  windows:
    command: WRSHServer.exe
    args:
      - -server
      - -log
      - "-Port={{.Ports.game}}"
      - "-QueryPort={{.Ports.query}}"

stop:
  timeout_seconds: 60

backup:
  paths: [WRSH/Saved]

linuxgsm:
  status: missing
  notes: Windows-only server, so it can't go into LinuxGSM without Wine. Sourced from the Pelican/Pterodactyl egg, which runs it under Wine.

notes:
  - Windows only; Anyserve doesn't run Windows servers under Wine.
  - The server writes Engine.ini and Game.ini on first start; Anyserve applies your settings from the second start on.
