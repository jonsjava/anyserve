schema: 1
id: gitea
name: Gitea
description: A lightweight self-hosted Git service with pull requests, issues, packages and CI (Actions).
homepage: https://about.gitea.com
version: "28.4.0-2"
kind: stack

settings:
  - key: domain
    prompt: Host name people will use (e.g. git.example.com)
    type: string
    default: localhost
    address: { port: http, form: host }
  - key: root_url
    prompt: Full web address (e.g. https://git.example.com/)
    type: string
    default: http://localhost:3000/
    address: { port: http, path: / }
  - key: disable_registration
    prompt: Turn off sign-ups? (the first account you create becomes the admin either way)
    type: bool
    default: false
  - key: secret_key
    prompt: Secret key (leave empty to generate one)
    type: string
    secret: true
    generate: true
  - key: internal_token
    prompt: Internal token (leave empty to generate one)
    type: string
    secret: true
    generate: true

ports:
  - name: http
    port: 3000
    protocol: tcp
    public: false
    description: The web UI, API and Git over HTTPS (through your proxy).
  - name: ssh
    port: 2222
    protocol: tcp
    public: false
    description: Git over SSH.

stack:
  services:
    - name: gitea
      image: gitea/gitea:28.4.0-rootless@sha256:15ab7fadb44981a2b781f40c712cad07066197f395100ea1c6326e14e5bb073a
      env:
        GITEA__database__DB_TYPE: sqlite3
        GITEA__database__PATH: /var/lib/gitea/data/gitea.db
        GITEA__server__DOMAIN: "{{.Settings.domain}}"
        GITEA__server__SSH_DOMAIN: "{{.Settings.domain}}"
        GITEA__server__ROOT_URL: "{{.Settings.root_url}}"
        GITEA__server__HTTP_PORT: "3000"
        GITEA__server__SSH_PORT: "{{.Ports.ssh}}"
        GITEA__server__SSH_LISTEN_PORT: "2222"
        GITEA__server__START_SSH_SERVER: "true"
        GITEA__security__INSTALL_LOCK: "true"
        GITEA__security__SECRET_KEY: "{{.Settings.secret_key}}"
        GITEA__security__INTERNAL_TOKEN: "{{.Settings.internal_token}}"
        GITEA__service__DISABLE_REGISTRATION: "{{truefalse .Settings.disable_registration}}"
      volumes:
        - { path: data, target: /var/lib/gitea }
        - { path: config, target: /etc/gitea }
      ports:
        - { port: http, target: 3000 }
        - { port: ssh, target: 2222 }

console:
  exec:
    service: gitea
    command: [sh]
    description: a shell in the Gitea container, for `gitea admin` commands

backup:
  paths: [data, config]
  stop_first: true

linuxgsm:
  status: missing
  notes: Not a game server, so it doesn't belong in LinuxGSM.

notes:
  - The first account you register becomes the admin. Set disable_registration afterwards if it's just for you.
