schema: 1
id: gotify
name: Gotify
description: A self-hosted server for sending and receiving push messages, with a web UI and Android app.
homepage: https://gotify.net
version: "3.1.1-2"
kind: stack

settings:
  - key: admin_user
    prompt: Admin user name (created on first start)
    type: string
    default: admin
  - key: admin_password
    prompt: Admin password (leave empty to generate one)
    type: string
    secret: true
    generate: true

ports:
  - name: http
    port: 8070
    protocol: tcp
    public: false
    description: The web UI, API and app connections.

stack:
  services:
    - name: gotify
      image: gotify/server:3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
      env:
        GOTIFY_SERVER_PORT: "8080"
        GOTIFY_DEFAULTUSER_NAME: "{{.Settings.admin_user}}"
        GOTIFY_DEFAULTUSER_PASS: "{{.Settings.admin_password}}"
      volumes:
        - { path: data, target: /app/data }
      ports:
        - { port: http, target: 8080 }

backup:
  paths: [data]
  stop_first: true

linuxgsm:
  status: missing
  notes: Not a game server, so it doesn't belong in LinuxGSM.

notes:
  - The admin password only applies on the first start. Change it later in the web UI.
