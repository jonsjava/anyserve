schema: 1
id: plains-of-pain
name: Plains of Pain
description: Plains of Pain survival dedicated server, installed through SteamCMD.
homepage: https://store.steampowered.com/app/1706670/Plains_of_Pain/
version: "1"
platforms: [linux]

install:
  steamcmd:
    app_id: 2227360

steps:
  - type: steam_sdk
  - type: chmod_exec
    path: PlainsOfPain.x86_64

settings:
  - key: server_name
    prompt: Server name
    type: string
    default: An Anyserve Plains of Pain server
  - key: max_players
    prompt: Maximum players
    type: int
    default: 10
    min: 1
    max: 200
  - key: difficulty
    prompt: Difficulty
    type: choice
    default: "1"
    choices:
      - { value: "0", label: Very easy }
      - { value: "1", label: Easy }
      - { value: "2", label: Normal }
      - { value: "3", label: Hard }
      - { value: "4", label: Very hard }
  - key: world_size
    prompt: World size (used only when the world is first created)
    type: choice
    default: "21"
    choices:
      - { value: "11", label: Tiny (11) }
      - { value: "21", label: Small (21) }
      - { value: "31", label: Medium (31) }
      - { value: "41", label: Large (41) }
      - { value: "51", label: Huge (51) }
  - key: password
    prompt: Server password (letters, digits, - and _; empty for none)
    type: string
    secret: true
    optional: true

ports:
  - name: game
    port: 7777
    protocol: udp
    public: true
    description: Players connect here.
  - name: query
    port: 27016
    protocol: udp
    public: true
    description: Steam server browser.

run:
  linux:
    command: PlainsOfPain.x86_64
    args:
      - -nographics
      - -batchmode
      - -ignorecompilererror
      - -servername
      - "{{.Settings.server_name}}"
      - -maxPlayers
      - "{{.Settings.max_players}}"
      - -port
      - "{{.Ports.game}}"
      - -queryPort
      - "{{.Ports.query}}"
      - -difficulty
      - "{{.Settings.difficulty}}"
      - -worldSize
      - "{{.Settings.world_size}}"
      - -cc
      - "{{if .Settings.password}}-password{{end}}"
      - "{{.Settings.password}}"
    env:
      LD_LIBRARY_PATH: "{{.Dir}}/linux64:{{.Dir}}"

stop:
  timeout_seconds: 60

backup:
  paths: [.config/unity3d]

container:
  image: debian:bookworm-slim
  packages: [ca-certificates, lib32gcc-s1]

linuxgsm:
  status: missing
  notes: Not in LinuxGSM. Sourced from the Pelican/Pterodactyl egg.

notes:
  - Saves live under .config/unity3d in the server folder, because Anyserve gives each server its own home.
