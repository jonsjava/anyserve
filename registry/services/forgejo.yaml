schema: 1
id: forgejo
name: Forgejo
description: A community-run Git forge (a Gitea fork) with pull requests, issues, packages and Actions.
homepage: https://forgejo.org
version: "17.0.2-1"
kind: stack

settings:
  - key: domain
    prompt: Host name people will use (e.g. git.example.com)
    type: string
    default: localhost
  - key: root_url
    prompt: Full web address (e.g. https://git.example.com/)
    type: string
    default: http://localhost:3003/
  - key: disable_registration
    prompt: Turn off sign-ups? (the first account you create becomes the admin either way)
    type: bool
    default: false
  - key: secret_key
    prompt: Secret key (leave empty to generate one)
    type: string
    secret: true
    generate: true
  - key: internal_token
    prompt: Internal token (leave empty to generate one)
    type: string
    secret: true
    generate: true

ports:
  - name: http
    port: 3003
    protocol: tcp
    public: false
    description: The web UI, API and Git over HTTPS (through your proxy).
  - name: ssh
    port: 2223
    protocol: tcp
    public: false
    description: Git over SSH.

stack:
  services:
    - name: forgejo
      image: codeberg.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
      env:
        FORGEJO__database__DB_TYPE: sqlite3
        FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
        FORGEJO__server__DOMAIN: "{{.Settings.domain}}"
        FORGEJO__server__SSH_DOMAIN: "{{.Settings.domain}}"
        FORGEJO__server__ROOT_URL: "{{.Settings.root_url}}"
        FORGEJO__server__HTTP_PORT: "3000"
        FORGEJO__server__SSH_PORT: "{{.Ports.ssh}}"
        FORGEJO__server__SSH_LISTEN_PORT: "2222"
        FORGEJO__server__START_SSH_SERVER: "true"
        FORGEJO__security__INSTALL_LOCK: "true"
        FORGEJO__security__SECRET_KEY: "{{.Settings.secret_key}}"
        FORGEJO__security__INTERNAL_TOKEN: "{{.Settings.internal_token}}"
        FORGEJO__service__DISABLE_REGISTRATION: "{{truefalse .Settings.disable_registration}}"
      volumes:
        - { path: data, target: /var/lib/gitea }
      ports:
        - { port: http, target: 3000 }
        - { port: ssh, target: 2222 }

console:
  exec:
    service: forgejo
    command: [sh]
    description: a shell in the Forgejo container, for `forgejo admin` commands

backup:
  paths: [data]
  stop_first: true

linuxgsm:
  status: missing
  notes: Not a game server, so it doesn't belong in LinuxGSM.

notes:
  - The first account you register becomes the admin. Set disable_registration afterwards if it's just for you.
  - To reach it from other computers, add `--expose http` (and `--expose ssh` for Git over SSH), or put an HTTPS proxy in front of it.
