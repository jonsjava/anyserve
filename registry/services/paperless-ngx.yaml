schema: 1
id: paperless-ngx
name: Paperless-ngx
description: A document manager that scans, OCRs and indexes your paper documents so you can search them.
homepage: https://docs.paperless-ngx.com
version: "3.5.1-1"
kind: stack

settings:
  - key: url
    prompt: Address people will use (e.g. https://paperless.example.com)
    type: string
    default: http://localhost:8000
  - key: admin_user
    prompt: Admin user name (created on first start)
    type: string
    default: admin
  - key: admin_password
    prompt: Admin password (leave empty to generate one)
    type: string
    secret: true
    generate: true
  - key: ocr_language
    prompt: OCR language of your documents, as Tesseract codes (e.g. eng, deu, eng+fra)
    type: string
    default: eng
  - key: consume_folder
    prompt: Folder on this machine to watch for new documents (leave empty to use the instance's own consume folder)
    description: Shared read-write. Paperless imports files dropped here and then deletes them.
    type: folder
    optional: true
  - key: secret_key
    prompt: Secret key (leave empty to generate one)
    type: string
    secret: true
    generate: true
  - key: postgres_password
    prompt: Database password (leave empty to generate one)
    type: string
    secret: true
    generate: true

ports:
  - name: http
    port: 8000
    protocol: tcp
    public: false
    description: The web UI and API.

stack:
  services:
    - name: redis
      image: valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
      volumes:
        - { path: data/redis, target: /data }
      health:
        command: [valkey-cli, ping]
        interval_seconds: 5
        retries: 20
    - name: postgres
      image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
      env:
        POSTGRES_USER: paperless
        POSTGRES_PASSWORD: "{{.Settings.postgres_password}}"
        POSTGRES_DB: paperless
      volumes:
        - { path: data/postgres, target: /var/lib/postgresql/data }
      health:
        command: [pg_isready, -U, paperless, -d, paperless]
        interval_seconds: 5
        retries: 20
    - name: paperless
      image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
      env:
        PAPERLESS_REDIS: redis://redis:6379
        PAPERLESS_DBHOST: postgres
        PAPERLESS_DBUSER: paperless
        PAPERLESS_DBPASS: "{{.Settings.postgres_password}}"
        PAPERLESS_DBNAME: paperless
        PAPERLESS_URL: "{{.Settings.url}}"
        PAPERLESS_SECRET_KEY: "{{.Settings.secret_key}}"
        PAPERLESS_ADMIN_USER: "{{.Settings.admin_user}}"
        PAPERLESS_ADMIN_PASSWORD: "{{.Settings.admin_password}}"
        PAPERLESS_OCR_LANGUAGE: "{{.Settings.ocr_language}}"
        # The image's own consume folder belongs to root, so without a
        # chosen folder Paperless watches one in the instance folder.
        PAPERLESS_CONSUMPTION_DIR: "{{if .Settings.consume_folder}}/usr/src/paperless/consume{{else}}/usr/src/paperless/inbox{{end}}"
      volumes:
        - { path: data/paperless, target: /usr/src/paperless/data }
        - { path: media, target: /usr/src/paperless/media }
        - { path: export, target: /usr/src/paperless/export }
        - { path: consume, target: /usr/src/paperless/inbox }
        - { setting: consume_folder, target: /usr/src/paperless/consume }
      ports:
        - { port: http, target: 8000 }
      depends_on: [redis, postgres]

stop:
  timeout_seconds: 60

console:
  exec:
    service: paperless
    command: [sh]
    description: a shell in the Paperless container, for its document_* management commands

backup:
  paths: [data, media]
  stop_first: true

linuxgsm:
  status: missing
  notes: Not a game server, so it doesn't belong in LinuxGSM.

notes:
  - The first start takes a few minutes while Paperless sets up its database.
  - Paperless only answers on the address in url (by default http://localhost:8000). If you use `--expose http` for your LAN, set url to the address you'll browse to, such as http://192.168.1.10:8000.
  - Backups cover the database and your stored documents (media). Use Paperless's own exporter for a portable copy.
