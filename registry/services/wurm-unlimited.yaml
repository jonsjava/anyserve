schema: 1
id: wurm-unlimited
name: Wurm Unlimited
description: Code Club AB's Wurm Unlimited dedicated server, run headless without the GUI launcher.
homepage: https://www.wurmonline.com/wurm-unlimited/
version: "1"
platforms: [linux, windows]

install:
  steamcmd:
    app_id: 402370

steps:
  # The server ships template worlds under dist/. Copy both so switching
  # world type later works, and mark each as a game directory.
  - type: copy_dir_if_missing
    from: dist/Creative
    to: Creative
  - type: copy_dir_if_missing
    from: dist/Adventure
    to: Adventure
  - type: touch
    path: Creative/gamedir
  - type: touch
    path: Adventure/gamedir
  # The Linux server needs Steam's client library next to its native libs.
  - type: copy_file_if_missing
    from: linux64/steamclient.so
    to: nativelibs/steamclient.so
    os: [linux]
  - type: chmod_exec
    path: WurmServerLauncher
    os: [linux]

settings:
  - key: server_name
    prompt: Server name (shown in the server browser)
    type: string
    default: An Anyserve Wurm server
  - key: world
    prompt: World type
    type: choice
    default: Creative
    choices:
      - { value: Creative, label: "Creative (Freedom kingdom, no PvP)" }
      - { value: Adventure, label: "Adventure (kingdoms and PvP)" }
  - key: home_kingdom
    prompt: Home kingdom (Adventure only; Creative always uses Freedom)
    type: choice
    default: "4"
    choices:
      - { value: "1", label: Jenn-Kellon }
      - { value: "2", label: Mol-Rehan }
      - { value: "3", label: Horde of the Summoned }
      - { value: "4", label: Freedom }
  - key: max_players
    prompt: Maximum players
    type: int
    default: 200
    min: 1
    max: 1000
  - key: password
    prompt: Server password (leave empty for none)
    type: string
    secret: true
    optional: true
  - key: admin_password
    prompt: In-game admin password
    type: string
    secret: true
    generate: true
  - key: epic_settings
    prompt: Use Epic cluster rules (Epic skill curve)?
    type: bool
    default: false
  - key: ip
    prompt: IP address to bind (leave empty to let the server choose)
    type: string
    optional: true

ports:
  - name: game
    port: 3724
    protocol: tcp
    public: true
    description: Players connect here.
  - name: query
    port: 27016
    protocol: udp
    public: true
    description: Steam server browser queries.

run:
  linux:
    command: WurmServerLauncher
    args: &wuargs
      - "START={{.Settings.world}}"
      - "SERVERNAME={{.Settings.server_name}}"
      - "EXTERNALPORT={{.Ports.game}}"
      - "QUERYPORT={{.Ports.query}}"
      - "MAXPLAYERS={{.Settings.max_players}}"
      - "ADMINPWD={{.Settings.admin_password}}"
      - "{{if .Settings.password}}SERVERPASSWORD={{.Settings.password}}{{end}}"
      - "HOMESERVER=true"
      - "HOMEKINGDOM={{if eq .Settings.world \"Creative\"}}4{{else}}{{.Settings.home_kingdom}}{{end}}"
      - "LOGINSERVER=true"
      - "EPICSETTINGS={{truefalse .Settings.epic_settings}}"
      - "{{if .Settings.ip}}IP={{.Settings.ip}}{{end}}"
  windows:
    command: WurmServerLauncher.exe
    args: *wuargs

stop:
  timeout_seconds: 120

backup:
  paths: [Creative, Adventure]

container:
  image: debian:bookworm-slim
  packages: [ca-certificates, lib32gcc-s1]

linuxgsm:
  status: missing
  notes: Not in LinuxGSM as far as we know. This is the first planned contribution.

notes:
  - The headless launch arguments come from the original wurm_unlimited_server scripts.
  - "Known issue on Linux: the server's bundled Java crashes inside Steam's library when it shuts down. Whether the last moments of play are saved hasn't been checked yet, so back up before stopping."
  - The Windows launch has not been tested yet.
  - No native macOS server exists. Use the container target on a Mac.
