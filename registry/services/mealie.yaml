schema: 1
id: mealie
name: Mealie
description: A recipe manager and meal planner that imports recipes from any website by URL.
homepage: https://mealie.io
version: "3.31.0-1"
kind: stack

settings:
  - key: base_url
    prompt: Address people will use (e.g. https://recipes.example.com)
    type: string
    default: http://localhost:9925
  - key: allow_signup
    prompt: Let anyone with the address create an account?
    type: bool
    default: false
  - key: timezone
    prompt: Time zone (e.g. Europe/London)
    type: string
    default: UTC

ports:
  - name: http
    port: 9925
    protocol: tcp
    public: false
    description: The web app and API.

stack:
  services:
    - name: mealie
      image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
      env:
        BASE_URL: "{{.Settings.base_url}}"
        ALLOW_SIGNUP: "{{truefalse .Settings.allow_signup}}"
        TZ: "{{.Settings.timezone}}"
        DB_ENGINE: sqlite
      volumes:
        - { path: data, target: /app/data }
      ports:
        - { port: http, target: 9000 }

backup:
  paths: [data]
  stop_first: true

linuxgsm:
  status: missing
  notes: Not a game server, so it doesn't belong in LinuxGSM.

notes:
  - "Log in with changeme@example.com and password MyPassword, then change both straight away."
  - To reach it from other computers on your network, add `--expose http`.
